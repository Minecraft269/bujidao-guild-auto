name: "Tests & Coverage"

on:
  push:
    # 只在**代码**变更时跑：纯文档改动不影响测试结果，
    # 让它跑一遍是白烧 CI 分钟数（本项目是全矩阵 3.10/3.11/3.12，一次跑等于三份）。
    # 注意 paths-ignore 的语义是「本次推送匹配到的变更全在忽略列表里，才跳过」——
    # 一次提交既改 .py 又改 .md 时仍然会跑，这是想要的行为。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    # PR 同样处理：review 文档改动时不跑全量测试。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# windows-latest ships Git Bash; pin it so POSIX env-prefixes
# (COVERAGE_FILE=... python -m pytest) and `set -e` behave identically.
defaults:
  run:
    shell: bash

env:
  # The suite prints Chinese progress lines (tests/test_async_executor.py).
  # On the runner stdout is a pipe with the runner's ANSI codepage (cp1252),
  # where those prints raise UnicodeEncodeError and abort the test process.
  # Measured locally: printing Chinese to a cp1252 pipe -> exit 1 + traceback.
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: "py${{ matrix.python-version }}"
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov
          # src-layout:测试导入的是「已安装的包」,不是当前目录的同名文件。
          # 少这一步会让 `import guild_auto` 找不到包(而不是悄悄导入根目录旧文件)。
          python -m pip install -e . --no-deps

      # Exit code 5 == EXIT_NOTESTSCOLLECTED. Without this, a renamed/moved
      # tests/ dir yields a silent green run with no coverage data at all.
      - name: Guard against empty test collection
        run: |
          set +e
          python -m pytest tests --collect-only -q
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "::error::pytest collected 0 tests (exit 5) - refusing to report green"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # Two independent coverage runs, separate data files, separate reports.
      #   1) core layer : guild_auto.domain.parsers / .decisions (decision engine)
      #                   / guild_auto.config / .domain.reporter
      #                   / guild_auto.concurrency.async_system     -> 98
      #   2) overall    : all production source, tests/ excluded  -> 92
      # `set +e` so BOTH runs always execute and always emit reports even when
      # the first gate already failed - otherwise a core breach would hide the
      # overall number, which is exactly what you need to triage it.
      # Reports go under htmlcov/ (already in .gitignore) so running the gates
      # locally cannot leave untracked xml/html behind.
      #
      # Core-layer membership note: async_system.py is the CURRENT async state
      # machine (the spec's "main thread only sends, background verifies" one).
      # async_executor.py is the LEGACY executor whose join()-blocking semantics
      # the rewrite replaces, so it is deliberately NOT in the core gate - it is
      # still measured by the overall run until the rewrite retires it.
      - name: Coverage gates - core >= 98%, overall >= 92%
        run: |
          set +e

          echo "### Gate 1/2: core layer (parsers, decisions, rules, config, reporter, async_system) >= 98%"
          COVERAGE_FILE=.coverage.core python -m pytest tests -v --cov=guild_auto.domain.parsers --cov=guild_auto.domain.decisions --cov=guild_auto.domain.rules --cov=guild_auto.config --cov=guild_auto.domain.reporter --cov=guild_auto.concurrency.async_system --cov-report=term-missing --cov-report=xml:htmlcov/core.xml --cov-report=html:htmlcov/core --cov-fail-under=98
          rc_core=$?

          echo ""
          echo "### Gate 2/2: overall production source >= 92% (tests/ + dot-dirs excluded)"
          # omit 只能写在覆盖率配置里(pytest-cov 没有 --cov-omit 这个参数),
          # 所以通过 COVERAGE_RCFILE 指向仓库根的 .coveragerc。
          COVERAGE_FILE=.coverage.total COVERAGE_RCFILE=.coveragerc python -m pytest tests -v --cov=guild_auto --cov-report=term-missing --cov-report=xml:htmlcov/total.xml --cov-report=html:htmlcov/total --cov-fail-under=92
          rc_total=$?

          set -e

          echo ""
          echo "core gate exit=$rc_core (threshold 98) / overall gate exit=$rc_total (threshold 92)"
          if [ "$rc_core" -ne 0 ] || [ "$rc_total" -ne 0 ]; then
            echo "::error::Coverage gate failed (core exit=$rc_core, overall exit=$rc_total) - both must pass"
            exit 1
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: warn
          retention-days: 14