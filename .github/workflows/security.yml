name: Security

on:
  push:
    branches: [main]
    # 用 paths **白名单**（不是 ignore）:只有代码或依赖清单变了才扫。
    # 三个 job 的敏感面不同（CodeQL 看 .py、pip-audit 看 requirements.txt），
    # 白名单比 ignore 更安全 —— 以后新增配置类文件也不会被误扫。
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    # 同上。dependency-review job 自身还有 PR-only 的 if 守卫。
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    # 每周一 04:27 UTC（避开整点，减少排队；cron 只在默认分支生效）
    # 定期扫描是兜底：即使没有新提交，也可能有新披露的 CVE。
    # 它刻意**不受**上面的 paths 白名单约束 —— 跑的是全量。
    - cron: '27 4 * * 1'

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认最小权限：只读代码。各 job 按需提权（见各 job 的 permissions）。
permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (python)
    # CodeQL 只分析 *.py，文档变更不会引入代码缺陷，跑了是空转。
    # 这里的 paths 与 on.push.paths 成对：push/PR 都不看文档，
    # 而 schedule / workflow_dispatch 不受 paths 约束，仍跑全量兜底扫描。
    runs-on: windows-latest
    permissions:
      contents: read
      # 上传 SARIF 到 Security 面板 / code scanning alerts
      security-events: write
      # 私有仓库读 actions 元数据，CodeQL 分析必需；公开仓库可删
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # 纯解释型语言，无需 build 步骤（build-mode 默认即可）

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review (PR only)
    # 只在 PR 上有意义：需要 base 分支的依赖清单做 diff。
    # push / schedule / workflow_dispatch 触发时整个 job 被跳过。
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    # ⚠ 实测该 action 在本仓库报“Dependency review is not supported on this
    # repository”（需要 Dependency graph；公开仓库无法通过 REST 打开该开关）。
    # 依赖漏洞由本文件的 pip-audit + CodeQL 兜底，故此处不阻塞合并；
    # 一旦仓库可支持 dependency graph，把 continue-on-error 去掉即可。
    #
    # ⚠ continue-on-error 必须放在 **step** 上，不能放 job 上：
    # job 级只阻止整个 workflow run 变红，job 自身的 check conclusion 仍是
    # failure（实测 run 40743352110：conclusion=failure）—— 分支保护与
    # Dependabot 自动合并都会把它当成失败检查。
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        continue-on-error: true
        uses: actions/dependency-review-action@v5

  pip-audit:
    name: pip-audit
    # Windows：winsdk / pywin32 / pyscreeze 等依赖只有 Windows 上能正确解析，
    # Linux runner 上 pip-audit 会因找不到发行版而误报或解析失败。
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit

      - name: Audit dependencies
        # 发现已知漏洞时 pip-audit 以非 0 退出码结束 -> job 失败（硬门禁）
        #
        # PYTHONIOENCODING/PYTHONUTF8 是必需的，不是保险起见：pip-audit 会输出漏洞的
        # 多语言描述（含中文），而 windows runner 的 stdout 是 cp1252 管道，
        # 打印非 cp1252 字符时抛 UnicodeDecodeError 直接把 job 打死
        # （实测 2026-10-05 的 schedule run 就是这样失败的 —— 不是漏洞，是编码）。
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: pip-audit -r requirements.txt