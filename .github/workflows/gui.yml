name: GUI

# 界面的「构建 + 静态检查」门禁（§10.2.1 工作流职责分离）。
# 测试与覆盖率在 gui-test.yml —— 拆开的原因：构建类失败要最先暴露（几分钟内），
# 而覆盖率/快照要装 Python+Pillow、跑 llvm-cov，慢得多；混在一个工作流里会让
# "只是 lint 挂了"也要等十分钟才红。
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "gui/**"
      - ".github/workflows/gui.yml"
  pull_request:
    paths:
      - "gui/**"
      - ".github/workflows/gui.yml"
  workflow_dispatch:

concurrency:
  group: gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端（biome / 构建）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Lint（biome check）
        run: npx biome check src tests

  rust:
    name: Rust（fmt / clippy / 构建）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: 格式检查（cargo fmt --check）
        run: cargo fmt --all -- --check

      - name: Clippy（-D warnings）
        run: cargo clippy --all-targets -- -D warnings

      - name: 构建（release 二进制能编出来）
        run: cargo build --release
