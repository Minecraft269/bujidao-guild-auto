name: "Mutation Test (mutmut)"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: mutmut-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  mutmut:
    name: mutmut (decisions.py)
    runs-on: windows-latest
    timeout-minutes: 60
    # 变异测试是"验证测试有效性"的加分项：耗时且结果仅供参考，
    # 因此不阻塞合并，但必须留下可读报告。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest mutmut
      - name: Run mutmut on the decision engine
        run: |
          set +e
          python -m mutmut run --paths-to-mutate src/guild_auto/domain/decisions.py 2>&1 | tail -40
          python -m mutmut results 2>&1 | tail -40
          exit 0
      - name: Upload mutmut report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-report
          path: mutants/
          if-no-files-found: warn
          retention-days: 14
