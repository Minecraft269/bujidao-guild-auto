name: "Lint"

on:
  push:
    # 只在代码变更时跑：ruff 只看 .py，纯文档改动跑了也是空转。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # windows-latest 自带 Git Bash。pin 成 bash 而不是默认 pwsh：与
    # test.yml / security.yml 保持一致，且 set +e / set -e 的退出码处理
    # 语义在 bash 下无歧义。
    shell: bash

env:
  # ruff 是静态分析，不需要装任何项目依赖（pyautogui / winsdk 等），所以这一步
  # 只装 ruff 自己。
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    name: ruff
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          # ruff 本身是单个二进制 wheel，装得极快；这里挂 cache 主要为了跟
          # test.yml / security.yml 共用同一个 pip 缓存条目（key 由
          # requirements.txt 决定，三条流水线共享），顺带省掉首次下载。
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install ruff
        # 固定版本以可复现：ruff 的规则集会随版本增删，同一 select 在不同版本下
        # 命中数不同。这里钉的是"本地实测跑通的那个版本"，不是随便挑的一个。
        # 若要换成别的版本，先本地跑一遍 notes 里的复核命令再改这里。
        run: python -m pip install "ruff==0.16.10"

      # 阻塞门禁。规则集与 line-length / target-version 全部来自 pyproject.toml
      # 的 [tool.ruff]，CLI 不再重复传参，避免两处配置漂移。
      - name: ruff check
        run: ruff check --output-format=github .

      # ruff format --check 已独立为 .github/workflows/format.yml（阻塞门禁），
      # 这里不再重复执行，避免同一次推送跑两遍格式化检查。
