name: "Dependabot Auto-merge"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  # 必须显式声明 checks: read —— 不声明时默认 none，读取 check-runs 会 403
  checks: read

env:
  # 本 job 不做 checkout（不需要源码），但 gh CLI 需要知道操作哪个仓库，
  # 否则报 “fatal: not a git repository”。
  GH_REPO: ${{ github.repository }}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    # 只处理 Dependabot 开的 PR；人工 PR 永不走自动合并
    if: github.actor == 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 等待检查完成（自行轮询，避免等待自己造成死锁）
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # 坑①：不能用 `gh pr checks --watch` —— 本 job 自身的检查也在列表里，
          # 会一直等自己 → 死锁。改为轮询 commits/{sha}/check-runs。
          #
          # 坑③（2026-11-07 实测）：排除名必须写 **job id**。本 job 没有显式 name，
          # check-run 名就是 `auto-merge`（小写连字符）；原来只排除 "Auto-merge"，
          # 于是自己永远算作 pending=1 → 轮询满 80 轮超时 → 合并步骤整段不执行，
          # 而脚本结尾 exit 0，运行显示 success，表现为"自动合并没生效"却无任何报错。
          SELF_NAME=auto-merge
          for i in $(seq 1 80); do
            json=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100")
            total=$(echo "$json" | jq --arg me "$SELF_NAME" '[.check_runs[] | select(.name != $me and .name != "Auto-merge")] | length')
            pending=$(echo "$json" | jq --arg me "$SELF_NAME" '[.check_runs[] | select(.name != $me and .name != "Auto-merge") | select(.status != "completed")] | length')
            failed=$(echo "$json" | jq --arg me "$SELF_NAME" '[.check_runs[] | select(.name != $me and .name != "Auto-merge") | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length')
            echo "checks total=$total pending=$pending failed=$failed (round $i)"
            if [ "$failed" -gt 0 ]; then echo "has_failure=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then echo "all_green=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 20
          done
          # 超时前的最后一次判定：失败为 0 且剩余 pending 也为 0（已排除自身）时，
          # 仍按全部通过处理，避免因某个长期 queued 的非阻塞检查而永远不合。
          echo "timeout=true" >> "$GITHUB_OUTPUT"
          if [ "$failed" -eq 0 ] && [ "$pending" -eq 0 ]; then
            echo "all_green=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 合并（不加 --delete-branch）
        if: steps.wait.outputs.all_green == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          # 坑②：仓库已开 delete_branch_on_merge，合并时 GitHub 会自动删分支；
          # 再加 --delete-branch 会二次删除并报错，可能被误判为"合并不了"。
          out=$(gh pr merge "$PR" --squash --auto 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then
            gh pr comment "$PR" --body "@dependabot rebase — 自动合并失败（可能与其他改动冲突），请 rebase 后重试。"
          fi
          # 失败必须暴露成红：以前这里固定 exit 0，合并失败也显示成功，
          # 于是"自动合并没有生效"完全看不出来（2026-11-07 实测踩过）。
          exit $rc

      - name: 有检查失败 — 留给人处理
        if: steps.wait.outputs.has_failure == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body "CI 有检查未通过，已跳过自动合并，请人工查看。"
