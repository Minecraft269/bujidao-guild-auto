name: Build

on:
  # push 到任意分支都构建 —— 目的是让打包本身被持续验证。
  # 原先只配了 pull_request,但自家仓库 push 到 main 不会产生 PR 事件,
  # 结果 Build 从创建起零运行(实测 gh run list --workflow=build.yml 无任何记录),
  # 等于"构建流水线存在但从未实际触发"。
  push:
    branches: ['**']
    # 只在代码变更时构建 —— 这是四条里最贵的一条(约 1m46s + PyInstaller + UPX),
    # 纯文档改动不改变任何可打包内容,跑了纯属浪费。
    # tag 触发**不受 paths-ignore 影响**,所以打 tag 发 Release 的路径仍然畅通。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:
  # 打 tag 时也会触发。GitHub Actions 对 tag 推送**不应用** paths-ignore,
  # 因此 Publish release 步骤一定会在 tag 构建中执行到。

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 变体矩阵由能力注册表推导,workflow 里不出现任何一个变体名。
  # 新增能力时只改 src/guild_auto/capabilities.py,这里与 build 任务均无需改动
  # (plan.txt【阶段 7】1.4:禁止把 8 种组合逐个硬写到 CI)。
  # ---------------------------------------------------------------------------
  variants:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Generate matrix from capability registry
        id: matrix
        shell: bash
        run: |
          matrix=$(python scripts/build-variants.py --list)
          # GITHUB_OUTPUT 每个 key 只吃单行,脚本已输出紧凑 JSON。
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "构建矩阵: $matrix" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # GUI 只构建一次（规范 §10.1）：4 个含 gui 的变体共用同一份 Gui.exe，
  # 按变体各编一遍既浪费机时，又会让版本漂移。
  # ---------------------------------------------------------------------------
  build-gui:
    name: Build GUI (tauri)
    needs: variants
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Install frontend deps
        working-directory: gui
        run: npm ci

      - name: Build Gui.exe + MSI
        working-directory: gui
        run: npx tauri build --bundles msi

      - name: Upload Gui.exe + MSI
        uses: actions/upload-artifact@v4
        with:
          name: gui-bundle
          path: |
            gui/src-tauri/target/release/bujidao-guild-gui.exe
            gui/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7
          if-no-files-found: error

  build:
    # 每个变体一条独立产物:构建期写入能力常量,运行时据此打印代号并拦截缺失功能。
    name: PyInstaller ${{ matrix.variant }}
    needs: [variants, build-gui]
    runs-on: windows-latest
    permissions:
      # 仅 tag 构建需要写权限创建 Release;PR 构建用不到。
      contents: write
    strategy:
      # 某个变体构建失败时不要取消其余变体 —— 需要看到"哪个变体坏了"。
      fail-fast: false
      matrix: ${{ fromJSON(needs.variants.outputs.matrix) }}
    env:
      APP_NAME: '布吉岛公会管理脚本'
      # 同时作为构建输入(写入常量)与本地冒烟运行时读取的能力清单。
      GUILD_AUTO_CAPABILITIES: ${{ matrix.capabilities }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install UPX
        # windows-latest 镜像不带 UPX，PyInstaller 检测不到就会静默跳过压缩
        # （只打一条 warning，产物不减小）。这里显式安装并校验版本，
        # 装不上就直接失败，而不是悄悄产出一个没压缩的 exe。
        #
        # 重试 3 次：choco 源偶发返回 "Unable to find package 'upx'"
        # （实测 PR#2 的 run 40754070293 就是这样失败的），属于外部索引抖动，
        # 不是版本或权限问题。最后一行的 upx --version 仍是硬门禁。
        #
        # 必须显式 shell: bash —— windows runner 默认是 PowerShell，
        # 它会把 `for i in 1 2 3; do` 当语法错误（实测 run 40756215039:
        # ParserError: Missing opening '(' after keyword 'for'）。
        shell: bash
        run: |
          for i in 1 2 3; do
            choco install upx --no-progress -y && break
            echo "::warning::UPX 安装第 $i 次失败（choco 源抖动），10 秒后重试"
            sleep 10
          done
          upx --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build
        # 能力清单先写成打包期常量:exe 运行时读不到 CI 的 env,
        # 靠这份常量才能打印自己的变体名(与 --list 同源,不会漂移)。
        #
        # 可选单元按能力裁剪:无 gui → 排除 tkinter;无 vision → 排除 winsdk,
        # 这样每个变体只带自己需要的依赖。
        #
        # 参数逐条复刻 build.bat 的 CLI 等价物。
        # 原因:.gitignore 含 *.spec,该 spec 未纳入版本控制,CI 全新检出拿不到它。
        run: |
          python scripts/build-variants.py --write-const src/guild_auto/_build_capabilities.py
          $caps = $env:GUILD_AUTO_CAPABILITIES.Split(',')

          $pyinstaller_args = @(
            "--onefile", "--clean", "--noconfirm",
            "--name", "$env:APP_NAME-${{ matrix.variant }}${{ matrix.artifact_suffix }}",
            "--paths", "src"
          )
          if ($caps -contains 'vision') {
            $pyinstaller_args += @("--collect-all", "winsdk")
          } else {
            $pyinstaller_args += @("--exclude-module", "winsdk")
          }
          # 界面已迁到独立的 tauri 进程，核不再 import 任何 GUI 库，
          # 所以这里不再按能力排除 tkinter（核里已经没有它）。
          # 以下为体积优化,与能力无关。
          $pyinstaller_args += @(
            "--exclude-module", "cv2",
            "--exclude-module", "numpy",
            "--exclude-module", "PyQt5",
            "--exclude-module", "matplotlib",
            "--exclude-module", "scipy",
            "--exclude-module", "IPython",
            "--exclude-module", "pandas",
            "--exclude-module", "PIL.ImageTk",
            "--exclude-module", "win32api",
            "--exclude-module", "win32com",
            "--exclude-module", "win32con",
            "--exclude-module", "pythoncom",
            "--exclude-module", "pywintypes",
            "--exclude-module", "pytest",
            "src/guild_auto/main.py"
          )
          pyinstaller @pyinstaller_args

      - name: Smoke test variant banner
        # 冒烟:清掉环境变量,强制读刚写入的打包期常量 —— 这才能证明
        # "产物脱离 env 也能报出自己的变体名"。期望值来自矩阵本身,
        # 不是手抄的变体名,新增能力时无需改这段。
        #
        # 比较放在 Python 里做:Windows runner 的 stdout 是 cp1252 管道,
        # 中文横幅直接 print 会抛 UnicodeEncodeError(实测 run 40816661358
        # 8 个变体全部因此失败)。把期望值当参数传给 Python,由它比较并
        # 用退出码表意,PowerShell 只负责看退出码,不参与字符串比对。
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        shell: bash
        run: |
          unset GUILD_AUTO_CAPABILITIES
          python - "${{ matrix.variant }}" "${{ matrix.capabilities }}" <<'PY'
          import sys
          from guild_auto import capabilities as c

          expected_variant, expected_caps = sys.argv[1], sys.argv[2]
          banner = c.build_banner()
          expected = f"构建变体: {expected_variant}    已启用能力: {expected_caps}"
          print(banner)
          if banner != expected:
              print(f"变体横幅不符: 期望 [{expected}] 实际 [{banner}]", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Report size
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'dist/ 下没有 .exe，构建未产出' }
          $mb = [math]::Round($exe.Length / 1MB, 2)
          "### Build artifact (${{ matrix.variant }})" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| File | Size |" >> $env:GITHUB_STEP_SUMMARY
          "| --- | --- |" >> $env:GITHUB_STEP_SUMMARY
          "| $($exe.Name) | $mb MB |" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "产物: $($exe.FullName) ($($exe.Length) 字节, $mb MB)"


      - name: Download shared Gui.exe + MSI
        if: contains(matrix.capabilities, 'gui')
        uses: actions/download-artifact@v4
        with:
          name: gui-bundle
          path: gui-dist

      - name: Assemble GUI bundle
        # 含 gui 的变体：取回共用 Gui.exe → 与核 exe 同目录 → 启动.cmd → zip → MSI → latest.json
        if: contains(matrix.capabilities, 'gui')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path gui-dist | Out-Null
                    $core = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $core) { throw 'dist/ 下没有核 exe' }
          $gui = Get-ChildItem gui-dist -Recurse -Filter 'bujidao-guild-gui.exe' | Select-Object -First 1
          if (-not $gui) { throw 'gui-dist 下没有 Gui.exe' }
          $msi = Get-ChildItem gui-dist -Recurse -Filter '*.msi' | Select-Object -First 1
          $args = @(
            'scripts/package.py',
            '--core', $core.FullName,
            '--gui', $gui.FullName,
            '--variant', '${{ matrix.variant }}',
            '--full-suffix', '${{ matrix.artifact_suffix }}',
            '--out', 'dist'
          )
          if ($msi) { $args += @('--msi', $msi.FullName) }
          & python @args
          Get-ChildItem dist | ForEach-Object { "  {0}  {1} bytes" -f $_.Name, $_.Length }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # artifact 名含变体代号(+全能力变体的 -Full 后缀),8 个变体互不覆盖。
          name: dist-${{ matrix.variant }}${{ matrix.artifact_suffix }}-${{ github.run_number }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Publish release
        # 只在打 tag 时发 Release;普通分支 push / PR / 手动触发只留 artifact。
        if: "${{ startsWith(github.ref, 'refs/tags/') }}"
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
