name: "Type Check (mypy)"

on:
  push:
    paths-ignore: ['**.md', 'docs/**', '.gitignore', '.gitattributes', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.gitignore', '.gitattributes', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: mypy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  mypy:
    name: mypy
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install mypy
      # 阻塞门禁。配置见 pyproject.toml [tool.mypy]：
      # 本项目为渐进式类型化，禁用 strict 系列，只拦真正的类型错误。
      - name: Run mypy
        run: python -m mypy src/guild_auto
