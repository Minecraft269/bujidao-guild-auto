version: 2

updates:
  # Python 依赖：每周检查，minor/patch 合并成一个 PR 以减少噪音
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    assignees: ["Minecraft269"]
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # GitHub Actions 依赖
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    assignees: ["Minecraft269"]
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
