name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 功能"
    labels: ["enhancement"]
  - title: "🐛 修复"
    labels: ["bug"]
  - title: "📦 依赖更新"
    labels: ["dependencies"]
  - title: "🧪 测试与 CI"
    labels: ["ci", "tests"]
  - title: "📝 文档"
    labels: ["documentation"]
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
version-resolver:
  major:
    labels: ["major", "breaking"]
  minor:
    labels: ["minor", "enhancement"]
  patch:
    labels: ["patch", "bug"]
  default: patch
template: |
  ## 本次变更

  $CHANGES
