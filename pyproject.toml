# 项目元数据 + 依赖 + 工具配置(ruff / pytest / coverage)。
# src-layout:生产代码全部在 src/guild_auto/ 下,根目录不放 .py ——
# 这样测试只能导入「已安装的包」,杜绝"当前目录同名文件优先"导致的假绿。

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guild-auto"
version = "2.0.0"
description = "布吉岛公会管理脚本 —— 半自动公会成员贡献统计与升/降/踢执行"
readme = "docs/README.md"
requires-python = ">=3.10"
license = { text = "All Rights Reserved" }
dependencies = [
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
ocr = ["winsdk>=1.0.0b10"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.10",
]

[project.scripts]
guild-auto = "guild_auto.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# 选择依据：全是"零误报 + 零存量违规"的规则族。
# E9   语法错误（含 IOError 等）
# F    pyflakes：未定义名 / 逻辑错误
# A    flake8-builtins：遮蔽内建名
# TC   flake8-type-checking：类型注解该走的 import
# ICN  flake8-import-conventions
# ISC001-003  隐式字符串拼接歧义（常见于漏逗号的元组）
# RSE   flake8-raise：raise 写法
# TID   flake8-tidy-imports：禁用 API（banned-api）
select = ["E9", "F", "A", "TC", "ICN", "ISC001", "ISC002", "ISC003", "RSE", "TID"]

# 存量欠账，先放行不阻塞 CI。全部可用 `ruff check --select <CODE> --fix` 或手改，
# 逐条清完即可从 ignore 里删掉（见 CI notes 的欠账清单）。
ignore = [
  "F401",  # unused-import
  "F541",  # f-string 无占位符
  "F811",  # 重复定义
  "F841",  # 局部变量赋值后未使用
]

[tool.ruff.lint.isort]
known-first-party = ["guild_auto"]

# ---------------------------------------------------------------------------
# pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# src-layout 下测试必须导入已安装的包。这里额外把 src 塞进 pythonpath，
# 使本地未 pip install -e . 时也能跑（CI 走 pip install -e . 的主路径）。
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

# 覆盖率配置唯一真源是仓库根的 .coveragerc —— coverage 在 CWD 会自动加载它,
# pyproject 里的 [tool.coverage.*] 永远不会生效,故不在此重复声明(避免两处漂移)。

# ---------------------------------------------------------------------------
# mypy（阻塞门禁，见 .github/workflows/mypy.yml）
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src/guild_auto"]
# 渐进式类型化：存量代码大量无注解，先只拦真正的类型错误。
ignore_missing_imports = true
allow_untyped_defs = true
allow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
